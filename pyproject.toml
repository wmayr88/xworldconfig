[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xworldconfig"
version = "0.1.0"
description = "GUI tool for managing simHeaven X-World scenery pack and object-type toggles in X-Plane 12"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["xworldconfig*"]
